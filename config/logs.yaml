version: 1
disable_existing_loggers: false

# Formatadores de texto
formatters:
  simple:
    format: "%(levelname)s: %(message)s"
  detailed:
    format: "[%(levelname)s|%(module)s|L%(lineno)d] %(asctime)s: %(message)s"
    datefmt: "%Y-%m-%dT%H:%M:%S%z"

# Onde as mensagens serão exibidas/salvas
handlers:
  console:
    class: logging.StreamHandler
    level: DEBUG
    formatter: simple
    stream: ext://sys.stderr
  
  file:
    class: logging.handlers.TimedRotatingFileHandler
    level: DEBUG
    formatter: detailed
    filename: logs/bifrost.log
    when: midnight
    interval: 1
    backupCount: 7
    encoding: utf8

# Configurações específicas por módulo
loggers:
  protocols.mqtt_handler:
    level: DEBUG
    handlers: [console, file]
    propagate: false
    
  protocols.serial_handler:
    level: DEBUG
    handlers: [console, file]
    propagate: false
    
  utils.registry:
    level: DEBUG
    handlers: [console, file]
    propagate: false
  
  core.event_bus:
    level: DEBUG
    handlers: [console, file]
    propagate: false

  core:
    level: INFO
    handlers: [console, file]
    propagate: false

# Configuração global (fallback)
root:
  level: DEBUG
  handlers: [console, file]