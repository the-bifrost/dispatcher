# .github/workflows/docker-publish.yml
# -----------------------------------------------------------------------------
# Builda e publica a imagem multi-arquitetura no GitHub Container Registry (GHCR).
#
# Dispara quando:
#   - você faz push de uma tag de versão (ex.: v1.0.0), ou
#   - você roda manualmente pela aba Actions (workflow_dispatch).
#
# A imagem publicada fica em:
#   ghcr.io/<seu-usuario>/ups-tsshara-monitor
#
# Depois do primeiro publish, deixe o pacote PÚBLICO em:
#   github.com > seu perfil > Packages > (o pacote) > Package settings > Change visibility
# e vincule ao repositório na mesma tela ("Connect repository").
# -----------------------------------------------------------------------------

name: Publicar imagem no GHCR

on:
  push:
    tags:
      - "v*"          # dispara em tags como v1.0.0, v1.2.3
  workflow_dispatch:  # permite rodar manualmente pela UI

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}   # ex.: thalesgmartins/ups-tsshara-monitor

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      packages: write   # necessário para o token embutido publicar no GHCR

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      # QEMU permite emular ARM (Raspberry Pi) a partir do runner x86
      - name: Configurar QEMU
        uses: docker/setup-qemu-action@v3

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}   # token automático, sem PAT

      # Gera tags/labels automaticamente a partir da tag do git
      - name: Extrair metadados (tags e labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}       # v1.2.3 -> 1.2.3
            type=semver,pattern={{major}}.{{minor}} # v1.2.3 -> 1.2
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build e push (amd64 + arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Cria a Release no GitHub - SO quando o disparo foi uma tag (nao no run manual)
      - name: Criar Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true   # gera as notas a partir dos commits/PRs desde a ultima tag
          body: |
            Imagem Docker publicada em:
            `ghcr.io/${{ github.repository }}:${{ github.ref_name }}`

            Para atualizar no host:
            ```bash
            sudo docker compose pull
            sudo docker compose up -d
            ```

# -----------------------------------------------------------------------------
# Depois de publicado, no host (Raspberry Pi) o docker-compose.yml pode trocar
#   build: .
# por
#   image: ghcr.io/<seu-usuario>/ups-tsshara-monitor:latest
# e a pessoa nunca mais precisa compilar nada localmente.
# -----------------------------------------------------------------------------
