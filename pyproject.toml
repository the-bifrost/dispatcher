[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dispatcher"
version = "2.0.0"
description = "Despacha mensagens entre dispositivos de acordo com o protocolo."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Thales Martins", email = "thalesdiniz30@gmail.com"},
    { name = "Kerlon Ribeiro", email = "mitokerlon1227@gmail.com"}
]

# Dependências do projeto (passando o requirements.txt para cá)
dependencies = [
    # Libs de Configurações
    "pyyaml",
    "pydantic",
    "pydantic-settings",

    # Libs de Protocolos
    "pyserial",
    "pyserial-asyncio",
    "aiomqtt",

    # Persistência dos dados
    "aiosqlite",

    # API e Servidor Web
    "fastapi",
    "uvicorn",
    "websockets",

    # Segurança
    "bcrypt",
]

[project.optional-dependencies]
dev = ["ruff", "pytest", "pre-commit"]

[tool.setuptools.packages.find]
include = ["dispatcher*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
